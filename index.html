<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teck_DRX — Official Hub</title>
<style>
:root {
  --bg: #090b10;
  --card-bg: rgba(20, 25, 38, 0.75);
  --accent: #00f0ff;
  --accent-purple: #7000ff;
  --text: #ffffff;
  --text-muted: #8a99ad;
  --border: rgba(0, 240, 255, 0.2);
  --danger: #ff4757;
}

* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
body { background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 50px; }

header { text-align: center; padding: 40px 20px 20px; position: relative; }
.auth-box { position: absolute; top: 20px; right: 20px; }

.avatar-container {
  width: 120px; height: 120px; margin: 0 auto 20px; position: relative; cursor: pointer;
}
.avatar-img {

  width: 100%; height: 100%; border-radius: 50%; object-fit: cover;
  border: 3px solid var(--accent); box-shadow: 0 0 25px rgba(0, 240, 255, 0.5); background: #111;
}
.avatar-edit-overlay {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 50%;
  background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center;
  color: #fff; font-size: 0.8rem; font-weight: bold; text-align: center;
}
.avatar-container:hover .avatar-edit-overlay.admin-active { display: flex; }

h1 { font-size: 2.5rem; color: var(--accent); }
.subtitle { color: var(--text-muted); }

.nav-tabs { display: flex; justify-content: center; gap: 10px; margin: 20px 0; }
.tab-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: #fff; padding: 10px 20px; border-radius: 10px; cursor: pointer; }
.tab-btn.active { background: var(--accent); color: #000; font-weight: bold; }

.container { max-width: 800px; margin: 0 auto; padding: 20px; }
.tab-content { display: none; }
.tab-content.active { display: block; }

.card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 15px; padding: 20px; margin-bottom: 20px; }
.admin-panel { display: none; background: rgba(255, 204, 0, 0.1); border: 1px dashed #ffcc00; padding: 15px; border-radius: 12px; margin-bottom: 20px; }
.admin-panel.active { display: block; }

input, textarea { width: 100%; background: #000; border: 1px solid var(--border); color: #fff; padding: 10px; border-radius: 8px; margin-bottom: 10px; }
.btn-cyber { background: var(--accent); color: #000; border: none; padding: 10px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; }

.post-card { background: rgba(0,0,0,0.5); border: 1px solid var(--border); padding: 15px; border-radius: 10px; margin-top: 15px; }
.post-img { width: 100%; max-height: 350px; object-fit: cover; border-radius: 8px; margin-top: 10px; }
</style>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  // Configuration Firebase Gratuite
  const firebaseConfig = {
    apiKey: "AIzaSyD-placeholder",
    authDomain: "teck-drx.firebaseapp.com",
    projectId: "teck-drx",
    storageBucket: "teck-drx.appspot.com",
    messagingSenderId: "123456789",
    appId: "1:123456789:web:abc123def"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  window.db = db;
  window.addDoc = addDoc;
  window.collection = collection;
  window.onSnapshot = onSnapshot;
  window.doc = doc;
  window.updateDoc = updateDoc;
</script>
</head>
<body>

<header>
  <div class="auth-box">
    <button class="btn-cyber" id="loginBtn" onclick="loginAdmin()">🔐 Connexion Admin</button>
    <span id="userInfo" style="display:none; color: #ffcc00; font-weight: bold;"></span>
  </div>

  <div class="avatar-container" onclick="triggerAvatarUpload()">
    <img id="avatarImg" src="https://via.placeholder.com/150/00f0ff/000000?text=DRX" alt="PDP" class="avatar-img">
    <div class="avatar-edit-overlay" id="avatarOverlay">📷 Changer la photo</div>
  </div>
  <input type="file" id="avatarInput" accept="image/*" style="display:none" onchange="uploadNewAvatar(this)">

  <h1>Teck_DRX</h1>
  <p class="subtitle">Tech • Gaming • Développeur Indépendant</p>
</header>

<div class="nav-tabs">
  <button class="tab-btn active" onclick="switchTab('guardianTab', this)">🎮 Legend of Guardian</button>
  <button class="tab-btn" onclick="switchTab('planningTab', this)">📅 Planning</button>
</div>

<div class="container">

  <div id="guardianTab" class="tab-content active">
    <div class="admin-panel" id="adminPanel">
      <h3 style="color: #ffcc00; margin-bottom: 10px;">🛠️ Espace Admin — Publier un devlog</h3>
      <input type="text" id="postTitle" placeholder="Titre (ex: Jour 4 — Nouvelle plateforme)">
      <textarea id="postDesc" rows="3" placeholder="Description de l'avancée..."></textarea>
      <input type="file" id="postImgInput" accept="image/*">
      <button class="btn-cyber" onclick="publishDevlog()">🚀 Publier en direct</button>
    </div>

    <div class="card">
      <h2>🎮 Journal de Bord</h2>
      <div id="postsContainer">Chargement des publications...</div>
    </div>
  </div>

  <div id="planningTab" class="tab-content">
    <div class="card">
      <h2>📅 Planning des sorties</h2>
      <p style="color: var(--text-muted);">Les prochains posts arriveront ici !</p>
    </div>
  </div>

</div>

<script>
let isAdmin = false;

function switchTab(tabId, btn) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
  document.getElementById(tabId).classList.add('active');
  btn.classList.add('active');
}

function loginAdmin() {
  const pwd = prompt("Mot de passe Admin :");
  if (pwd === "DANCO66Teck") {
    isAdmin = true;
    document.getElementById('loginBtn').style.display = 'none';
    document.getElementById('userInfo').innerText = "Connecté : Admin";
    document.getElementById('userInfo').style.display = 'inline';
    document.getElementById('adminPanel').classList.add('active');
    document.getElementById('avatarOverlay').classList.add('admin-active');
    alert("🔓 Mode Admin activé !");
  } else {
    alert("Mot de passe incorrect.");
  }
}

// Changement de photo de profil Admin
function triggerAvatarUpload() {
  if (isAdmin) {
    document.getElementById('avatarInput').click();
  }
}

function uploadNewAvatar(input) {
  if (input.files && input.files[0]) {
    const reader = new FileReader();
    reader.onload = function(e) {
      document.getElementById('avatarImg').src = e.target.result;
      localStorage.setItem('customAvatar', e.target.result);
      alert("Photo de profil mise à jour !");
    };
    reader.readAsDataURL(input.files[0]);
  }
}

// Charger l'avatar sauvegardé
if (localStorage.getItem('customAvatar')) {
  document.getElementById('avatarImg').src = localStorage.getItem('customAvatar');
}

// Publication du Devlog
function publishDevlog() {
  const title = document.getElementById('postTitle').value.trim();
  const desc = document.getElementById('postDesc').value.trim();
  const fileInput = document.getElementById('postImgInput');

  if (!title || !desc) {
    alert("Remplis le titre et la description !");
    return;
  }

  const processAndSave = (imgBase64) => {
    const posts = JSON.parse(localStorage.getItem('sharedPosts') || "[]");
    posts.unshift({
      title: title,
      desc: desc,
      img: imgBase64,
      date: new Date().toLocaleDateString('fr-FR')
    });
    localStorage.setItem('sharedPosts', JSON.stringify(posts));
    renderPosts();
    
    document.getElementById('postTitle').value = '';
    document.getElementById('postDesc').value = '';
    document.getElementById('postImgInput').value = '';
    alert("✅ Publié avec succès !");
  };

  if (fileInput.files && fileInput.files[0]) {
    const reader = new FileReader();
    reader.onload = (e) => processAndSave(e.target.result);
    reader.readAsDataURL(fileInput.files[0]);
  } else {
    processAndSave(null);
  }
}

function renderPosts() {
  const container = document.getElementById('postsContainer');
  const posts = JSON.parse(localStorage.getItem('sharedPosts') || "[]");

  if (posts.length === 0) {
    container.innerHTML = "<p style='color:var(--text-muted);'>Aucun post pour le moment.</p>";
    return;
  }

  container.innerHTML = posts.map(p => `
    <div class="post-card">
      <small style="color:var(--accent);">${p.date}</small>
      <h3 style="margin:5px 0;">${p.title}</h3>
      <p style="color:var(--text-muted);">${p.desc}</p>
      ${p.img ? `<img src="${p.img}" class="post-img">` : ''}
    </div>
  `).join('');
}

renderPosts();
</script>

</body>
</html>
